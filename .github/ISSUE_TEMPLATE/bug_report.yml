name: 🐛 Bug Report
description: Create a report to help us fix a bug or unexpected behavior in CutX.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open Finder
        2. Select file `test.txt`
        3. Press Cmd + X
        4. Navigate to Desktop and press Cmd + V
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: macOS Version
      placeholder: e.g. macOS Sonoma 14.5 / macOS Sequoia 15.0 (Apple Silicon / Intel)
    validations:
      required: true
